name: ci

on:
  pull_request:
  push:
    branches: [master, android]

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            service

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: Frontend unit tests
        run: pnpm test

      # tauri::generate_context! embeds the frontend and the bundle resources,
      # so the crate only compiles once both exist
      - name: Frontend build
        run: pnpm build

      - name: Fetch mihomo core
        run: node scripts/fetch-core.mjs
        env:
          # lifts the shared anonymous 60/h API pool (HTTP 403 on runners)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify bundled Geo data without download access
        run: node tests/geodata-offline-smoke.mjs

      - name: Build elevated service
        run: node scripts/build-service.mjs

      - name: Rust tests (app)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Rust tests (service, no installation)
        run: cargo test --manifest-path service/Cargo.toml --locked

  service-windows:
    # the SCM backend of the service only compiles on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: service
      - run: cargo test --manifest-path service/Cargo.toml --locked
