[package]
name = "mfork-service"
version = "0.1.2"
edition = "2021"
description = "Mfork elevated service: starts the mihomo core as SYSTEM for TUN mode"

[[bin]]
name = "mfork-service"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
strip = true
