[package]
name = "mfork"
version = "0.1.0"
description = "Mfork - a mihomo desktop client"
authors = ["mfork"]
edition = "2021"

[lib]
name = "mfork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
fastrand = "2"
reqwest = { version = "0.12", features = ["blocking", "gzip"] }
boa_engine = "0.20"
